<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Form </title>
</head>
<body>
<header>
    

    <nav>
        <a href="index.html">Home</a>
        <a href="our pets.html">Our Pets</a>
        <a href="adoption-form.html">Adoption Form</a>
    </nav>
</header>
<main>
   <section>
      <h2>Adoption form</h2>
 </main> 
     

        <p>
            Fill out the form below to tell us a little about yourself
            and the pet you would like to adopt.
        </p>
        
        <form>
            <label for="full-name">Full Name:</label>
<input 
    type="text" 
    id="full-name" 
    name="full-name" 
    placeholder="Enter your full name"
    required
    minlength="2"
    maxlength="50"
>

<label for="email">Email Address:</label>
<input 
    type="email" 
    id="email" 
    name="email" 
    placeholder="Enter your email address"
    required
>

<label for="password">Create a Password:</label>
<input 
    type="password" 
    id="password" 
    name="password" 
    placeholder="Create a password"
    required
    
>


    <legend>What type of pet are you interested in?</legend>

    <input type="radio" id="dog" name="pet-type" value="dog" required>
    <label for="dog">Dog</label>

    <input type="radio" id="cat" name="pet-type" value="cat">
    <label for="cat">Cat</label>

    <input type="radio" id="rabbit" name="pet-type" value="rabbit">
    <label for="Bird">Bird</label>

    
    <legend>Adoption Responsibilities</legend>

    <input type="checkbox" id="pet-care" name="responsibilities" value="pet-care" required>
    <label for="pet-care">I understand that pets need regular care and attention.</label>

    <input type="checkbox" id="home" name="responsibilities" value="home">
    <label for="home">I have a safe home environment for a pet.</label>

    <label for="pet">Which pet would you like to adopt?</label>

<select id="pet" name="pet" required>
    <option value="">-- Select a pet --</option>
    <option value="max">Max</option>
    <option value="bella">Bella</option>
    <option value="charlie">Charlie</option>
   <option value="Lina">Lina</option>

</select>
<label for="message">Why would you like to adopt a pet?</label>

<textarea
    id="message"
    name="message"
    rows="5"
    cols="40"
    placeholder="Tell us why you would like to adopt a pet..."
    required
    minlength="20"
    maxlength="300"
></textarea>

<button type="submit">Submit Application</button>

        </form>


</body>
</html>
